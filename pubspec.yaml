name: mobile_cleaner
description: A safe, fast, and transparent Android storage cleaner.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.2.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  logger: ^2.7.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  phosphor_icons: ^3.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: '#0F766E'
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  min_sdk_android: 24
